{% extends "layout.html" %}

{% block title %}Chirpy{% endblock title %}
{% block content %}
<div class="mx-0 auto">
<h6 class="text-center mt-3">Are you sure to delete the tweet?</h6>
<div>
<form class="d-flex justify-content-center align-items-center gap-2" method="post">
    {% csrf_token %}
    <button class="btn btn-dark">delete</button>
    <a class="btn btn-light text-dark border border-2 border border-dark" href="{% url 'tweet_list' %}">cancel</a>
</form>
</div>
</div>

{% endblock content %}
