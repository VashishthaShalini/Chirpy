 {% extends "layout.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="p-4 border rounded shadow-lg text-center" style="width: 400px;">
        <h2 class="fw-bold mb-4">Login Form</h2>
        <form method="post"> 
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-dark w-100">Login</button>
        </form> 
        <p class="mt-3">Don't have an account? 
            <a class="text-decoration-none" href="{% url 'register' %}">Register here!</a>
        </p>
    </div>
</div>
{% endblock %}
